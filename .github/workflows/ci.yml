name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code source
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configuration du JDK (Java 17 ou 21 selon votre projet)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven' # Active automatiquement le cache des dépendances Maven

    # 3. Compilation et exécution des tests unitaires
    - name: Build with Maven
      run: mvn -B clean verify